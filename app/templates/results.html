<div class="chart-container">
    <div class="chart-card">
        <h2>优化方向分类</h2>
        <canvas id="optimizationChart"></canvas>
    </div>
    <div class="chart-card">
        <h2>情感分析</h2>
        <canvas id="sentimentChart"></canvas>
    </div>
    <div class="chart-card">
        <h2>问题分类频率</h2>
        <canvas id="categoryChart"></canvas>
    </div>
    <div class="chart-card">
        <h2>有效回复统计</h2>
        <canvas id="effectiveChart"></canvas>
    </div>
</div>

<div class="data-table-card">
    <h2>分析数据</h2>
    <div class="data-table">
        {{ results.dataframe|safe }}
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    Chart.defaults.color = 'rgba(224, 224, 224, 1)';
    Chart.defaults.borderColor = 'rgba(51, 51, 51, 1)';

    new Chart(document.getElementById('optimizationChart'), {
        type: 'doughnut',
        data: {
            labels: {{ results.optimization_category_counts_labels|tojson }},
            datasets: [{
                data: {{ results.optimization_category_counts_values|tojson }},
                backgroundColor: ['#00aaff', '#00ffaa', '#ffaa00', '#ff00aa']
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: {
                    position: 'top',
                }
            }
        }
    });

    new Chart(document.getElementById('sentimentChart'), {
        type: 'pie',
        data: {
            labels: {{ results.sentiment_counts_labels|tojson }},
            datasets: [{
                data: {{ results.sentiment_counts_values|tojson }},
                backgroundColor: ['#ff4444', '#44ff44', '#aaaaaa']
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: {
                    position: 'top',
                }
            }
        }
    });

    new Chart(document.getElementById('categoryChart'), {
        type: 'bar',
        data: {
            labels: {{ results.category_counts_labels|tojson }},
            datasets: [{
                label: '频率',
                data: {{ results.category_counts_values|tojson }},
                backgroundColor: '#00aaff'
            }]
        },
        options: {
            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    });

    new Chart(document.getElementById('effectiveChart'), {
        type: 'pie',
        data: {
            labels: ['有效', '无效'],
            datasets: [{
                data: [{{ results.effective_reply_counts.get(True, 0) }}, {{ results.effective_reply_counts.get(False, 0) }}],
                backgroundColor: ['#44ff44', '#ff4444']
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: {
                    position: 'top',
                }
            }
        }
    });
</script>
