<div class="chart-container">
    <div class="chart-card">
        <h2>优化方向分类</h2>
        <canvas id="optimizationRadarChart"></canvas>
    </div>
    <div class="chart-card">
        <h2>情感分析</h2>
        <canvas id="sentimentChart"></canvas>
        <div class="sentiment-details">
            {% for sentiment, count in results.sentiment_counts.items() %}
            <div class="sentiment-item">
                <span class="sentiment-label">{{ sentiment }}</span>
                <span class="sentiment-count">{{ count }}</span>
                <span class="sentiment-percentage">({{ (count / results.sentiment_counts.values()|sum * 100)|round(1) }}%)</span>
            </div>
            {% endfor %}
        </div>
    </div>
    <div class="chart-card">
        <h2>问题分类频率</h2>
        <canvas id="categoryChart"></canvas>
    </div>
    <div class="chart-card">
        <h2>有效回复统计</h2>
        <canvas id="effectiveChart"></canvas>
    </div>
</div>

<div class="data-table-card">
    <h2>分析数据</h2>
    <div class="data-table">
        {{ results.dataframe|safe }}
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    Chart.defaults.color = 'rgba(224, 224, 224, 1)';
    Chart.defaults.borderColor = 'rgba(51, 51, 51, 1)';

    new Chart(document.getElementById('optimizationRadarChart'), {
        type: 'radar',
        data: {
            labels: {{ results.optimization_category_counts_labels|tojson }},
            datasets: [{
                label: '优化方向',
                data: {{ results.optimization_category_counts_values|tojson }},
                backgroundColor: 'rgba(0, 170, 255, 0.2)',
                borderColor: 'rgba(0, 170, 255, 1)',
                pointBackgroundColor: 'rgba(0, 170, 255, 1)',
                pointBorderColor: '#fff',
                pointHoverBackgroundColor: '#fff',
                pointHoverBorderColor: 'rgba(0, 170, 255, 1)'
            }]
        },
        options: {
            elements: {
                line: {
                    borderWidth: 3
                }
            }
        }
    });

    new Chart(document.getElementById('sentimentChart'), {
        type: 'pie',
        data: {
            labels: {{ results.sentiment_counts_labels|tojson }},
            datasets: [{
                data: {{ results.sentiment_counts_values|tojson }},
                backgroundColor: ['#ff4444', '#44ff44', '#aaaaaa']
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: {
                    position: 'top',
                }
            }
        }
    });

    new Chart(document.getElementById('categoryChart'), {
        type: 'bar',
        data: {
            labels: {{ results.category_counts_labels|tojson }},
            datasets: [{
                label: '频率',
                data: {{ results.category_counts_values|tojson }},
                backgroundColor: '#00aaff'
            }]
        },
        options: {
            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    });

    new Chart(document.getElementById('effectiveChart'), {
        type: 'pie',
        data: {
            labels: ['有效', '无效'],
            datasets: [{
                data: [{{ results.effective_reply_counts.get(True, 0) }}, {{ results.effective_reply_counts.get(False, 0) }}],
                backgroundColor: ['#44ff44', '#ff4444']
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: {
                    position: 'top',
                }
            }
        }
    });
</script>
